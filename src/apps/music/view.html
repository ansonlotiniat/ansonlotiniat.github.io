<section class="app-window music-window" data-window="music" data-app-label="Music" aria-labelledby="music-window-title" hidden>
    <div class="window-surface">
        <header class="window-titlebar music-titlebar" data-drag-handle>
            <div class="traffic-lights" role="group" aria-label="Window controls">
                <button class="traffic-close" type="button" data-window-action="close" aria-label="Close window"></button>
                <button class="traffic-minimize" type="button" data-window-action="minimize" aria-label="Minimize window"></button>
                <button class="traffic-maximize" type="button" data-window-action="maximize" aria-label="Maximize window"></button>
            </div>
            <h2 class="sr-only" id="music-window-title">Music</h2>
            <span class="titlebar-spacer" aria-hidden="true"></span>
        </header>
        <div class="music-app" data-music-app>
            <svg class="music-symbols" aria-hidden="true">
                <symbol id="music-search-icon" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m15.4 15.4 4.6 4.6"></path></symbol>
                <symbol id="music-home-icon" viewBox="0 0 24 24"><path d="m3.5 11 8.5-7 8.5 7"></path><path d="M5.5 9.8V20h13V9.8M9.5 20v-6h5v6"></path></symbol>
                <symbol id="music-new-icon" viewBox="0 0 24 24"><rect x="4" y="4" width="6.2" height="6.2" rx="1.1" fill="currentColor" stroke="none"></rect><rect x="13.8" y="4" width="6.2" height="6.2" rx="1.1" fill="currentColor" stroke="none"></rect><rect x="4" y="13.8" width="6.2" height="6.2" rx="1.1" fill="currentColor" stroke="none"></rect><rect x="13.8" y="13.8" width="6.2" height="6.2" rx="1.1" fill="currentColor" stroke="none"></rect></symbol>
                <symbol id="music-radio-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.1" fill="currentColor" stroke="none"></circle><path d="M8.3 8.2a5.4 5.4 0 0 0 0 7.6M15.7 8.2a5.4 5.4 0 0 1 0 7.6M5.2 5.2a9.6 9.6 0 0 0 0 13.6M18.8 5.2a9.6 9.6 0 0 1 0 13.6"></path></symbol>
                <symbol id="music-sidebar-icon" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"></path></symbol>
                <symbol id="music-pin-icon" viewBox="0 0 24 24"><path d="m8 4 8 0-1.2 5 2.8 3H6.4l2.8-3ZM12 12v8"></path></symbol>
                <symbol id="music-clock-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle><path d="M12 7v5l-3 2"></path></symbol>
                <symbol id="music-person-icon" viewBox="0 0 24 24"><circle cx="12" cy="7" r="3"></circle><path d="M6 20c.3-4 2.3-6 6-6s5.7 2 6 6"></path></symbol>
                <symbol id="music-album-icon" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M7 5V3h10v2"></path></symbol>
                <symbol id="music-song-icon" viewBox="0 0 24 24"><path d="M15.5 4v12a3 3 0 1 1-2-2.8V6l6-1.5v9.2a3 3 0 1 1-2-2.8V4.5Z"></path></symbol>
                <symbol id="music-video-icon" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="13" rx="2"></rect><path d="m9.5 9 5 2.5-5 2.5Z"></path></symbol>
                <symbol id="music-recommend-icon" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="2"></rect><circle cx="12" cy="9" r="2.3"></circle><path d="M8.5 17c.3-2.2 1.5-3.3 3.5-3.3s3.2 1.1 3.5 3.3"></path></symbol>
                <symbol id="music-playlists-icon" viewBox="0 0 24 24"><circle cx="6" cy="6" r="1.4" fill="currentColor" stroke="none"></circle><circle cx="12" cy="6" r="1.4" fill="currentColor" stroke="none"></circle><circle cx="18" cy="6" r="1.4" fill="currentColor" stroke="none"></circle><circle cx="6" cy="12" r="1.4" fill="currentColor" stroke="none"></circle><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"></circle><circle cx="18" cy="12" r="1.4" fill="currentColor" stroke="none"></circle><circle cx="6" cy="18" r="1.4" fill="currentColor" stroke="none"></circle><circle cx="12" cy="18" r="1.4" fill="currentColor" stroke="none"></circle><circle cx="18" cy="18" r="1.4" fill="currentColor" stroke="none"></circle></symbol>
                <symbol id="music-heart-icon" viewBox="0 0 24 24"><path d="M12 20S4.5 15.7 4.5 9.4A4.2 4.2 0 0 1 12 6.8a4.2 4.2 0 0 1 7.5 2.6C19.5 15.7 12 20 12 20Z"></path></symbol>
                <symbol id="music-previous-icon" viewBox="0 0 24 24"><path d="M20 6.5v11L11.5 12ZM11.5 6.5v11L2 12Z" fill="currentColor" stroke="none"></path></symbol>
                <symbol id="music-next-icon" viewBox="0 0 24 24"><path d="M3 6.5v11l9-5.5ZM11.5 6.5v11l10-5.5Z" fill="currentColor" stroke="none"></path></symbol>
                <symbol id="music-play-icon" viewBox="0 0 24 24"><path d="m5 3.5 15.5 8.5L5 20.5Z" fill="currentColor" stroke="none"></path></symbol>
                <symbol id="music-pause-icon" viewBox="0 0 24 24"><path d="M5 3.5h5v17H5zM12 3.5h6v17h-6z" fill="currentColor" stroke="none"></path></symbol>
                <symbol id="music-shuffle-icon" viewBox="0 0 24 24"><path d="M3.5 6.5h2.2c4.8 0 6.5 11 12.8 11H21M18 14.5l3 3-3 3M3.5 17.5h2.2c2.2 0 3.8-2.4 5.3-5.2M15 6.5h6M18 3.5l3 3-3 3"></path></symbol>
                <symbol id="music-repeat-icon" viewBox="0 0 24 24"><path d="M4 8h15l-3.5-3.5M20 8v3M20 16H5l3.5 3.5M4 16v-3"></path></symbol>
                <symbol id="music-autoplay-icon" viewBox="0 0 24 24"><path d="M3.5 5h2a7 7 0 0 1 0 14h-2zM20.5 5h-2a7 7 0 0 0 0 14h2z" fill="currentColor" stroke="none"></path></symbol>
                <symbol id="music-more-icon" viewBox="0 0 24 24"><circle cx="4" cy="12" r="2.2" fill="currentColor" stroke="none"></circle><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"></circle><circle cx="20" cy="12" r="2.2" fill="currentColor" stroke="none"></circle></symbol>
                <symbol id="music-queue-icon" viewBox="0 0 24 24"><circle cx="4" cy="6" r="1.4" fill="currentColor" stroke="none"></circle><circle cx="4" cy="12" r="1.4" fill="currentColor" stroke="none"></circle><circle cx="4" cy="18" r="1.4" fill="currentColor" stroke="none"></circle><path d="M7.5 6H21M7.5 12H21M7.5 18H21"></path></symbol>
                <symbol id="music-lyrics-icon" viewBox="0 0 24 24"><path d="M5.5 3.5h13a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3h-7l-5 3v-3h-1a3 3 0 0 1-3-3v-9a3 3 0 0 1 3-3Z"></path><path d="M7.3 8h4v3.5c0 2-1.1 3.2-3.3 3.7v-1.9c.8-.2 1.2-.7 1.3-1.4h-2Zm6.2 0h4v3.5c0 2-1.1 3.2-3.3 3.7v-1.9c.8-.2 1.2-.7 1.3-1.4h-2Z" fill="currentColor" stroke="none"></path></symbol>
                <symbol id="music-airplay-icon" viewBox="0 0 24 24"><path d="M4.1 14.3a9.5 9.5 0 1 1 15.8 0M7.1 12.7a6.1 6.1 0 1 1 9.8 0M9.8 10.9a2.7 2.7 0 1 1 4.4 0"></path><path d="m12 11.5-6.2 8.5h12.4Z" fill="currentColor" stroke="none"></path></symbol>
                <symbol id="music-volume-icon" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3Z" fill="currentColor" stroke="none"></path><path d="M15 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12M20.8 3.8a11.5 11.5 0 0 1 0 16.4"></path></symbol>
                <symbol id="music-note-icon" viewBox="0 0 24 24"><path d="M15.5 5.5v10.2a3 3 0 1 1-2-2.8V7l6-1.4v8.1a3 3 0 1 1-2-2.8V4.6Z"></path></symbol>
            </svg>
            <aside class="music-sidebar">
                <div class="music-sidebar-scroll">
                    <nav class="music-primary-nav" aria-label="Music sections">
                        <button type="button" data-music-focus-search><svg class="music-icon" aria-hidden="true"><use href="#music-search-icon"></use></svg><span data-copy-lang="zh">搜尋</span><span data-copy-lang="en">Search</span></button>
                        <button type="button" data-music-view="home"><svg class="music-icon" aria-hidden="true"><use href="#music-home-icon"></use></svg><span data-copy-lang="zh">首頁</span><span data-copy-lang="en">Home</span></button>
                        <button type="button" data-music-view="explore"><svg class="music-icon" aria-hidden="true"><use href="#music-new-icon"></use></svg><span data-copy-lang="zh">探索</span><span data-copy-lang="en">Explore</span></button>
                        <button type="button" data-music-view="radio"><svg class="music-icon" aria-hidden="true"><use href="#music-radio-icon"></use></svg><span data-copy-lang="zh">廣播</span><span data-copy-lang="en">Radio</span></button>
                    </nav>
                    <section class="music-sidebar-section music-pinned-section">
                        <h3><span data-copy-lang="zh">資料庫</span><span data-copy-lang="en">Library</span></h3>
                        <button class="music-pinned-heading" type="button" data-music-pins-toggle aria-expanded="true"><span class="music-disclosure" aria-hidden="true">⌄</span><svg class="music-icon" aria-hidden="true"><use href="#music-pin-icon"></use></svg><span data-copy-lang="zh">釘選項目</span><span data-copy-lang="en">Pinned Items</span></button>
                        <div class="music-pinned-list" data-music-pins></div>
                    </section>
                    <nav class="music-library-nav" aria-label="Music library">
                        <button class="is-active" type="button" data-music-view="recent"><svg class="music-icon" aria-hidden="true"><use href="#music-clock-icon"></use></svg><span data-copy-lang="zh">最近加入</span><span data-copy-lang="en">Recently Added</span></button>
                        <button type="button" data-music-view="artists"><svg class="music-icon" aria-hidden="true"><use href="#music-person-icon"></use></svg><span data-copy-lang="zh">藝人</span><span data-copy-lang="en">Artists</span></button>
                        <button type="button" data-music-view="albums"><svg class="music-icon" aria-hidden="true"><use href="#music-album-icon"></use></svg><span data-copy-lang="zh">專輯</span><span data-copy-lang="en">Albums</span></button>
                        <button type="button" data-music-view="songs"><svg class="music-icon" aria-hidden="true"><use href="#music-song-icon"></use></svg><span data-copy-lang="zh">歌曲</span><span data-copy-lang="en">Songs</span></button>
                        <button type="button" data-music-view="videos"><svg class="music-icon" aria-hidden="true"><use href="#music-video-icon"></use></svg><span>MV</span></button>
                        <button type="button" data-music-view="recommendations"><svg class="music-icon" aria-hidden="true"><use href="#music-recommend-icon"></use></svg><span data-copy-lang="zh">專屬推薦</span><span data-copy-lang="en">Made for You</span></button>
                    </nav>
                    <section class="music-sidebar-section music-playlist-section">
                        <h3><span data-copy-lang="zh">播放清單</span><span data-copy-lang="en">Playlists</span></h3>
                        <button class="music-sidebar-row" type="button" data-music-view="playlists"><svg class="music-icon" aria-hidden="true"><use href="#music-playlists-icon"></use></svg><span data-copy-lang="zh">所有播放清單</span><span data-copy-lang="en">All Playlists</span></button>
                        <button class="music-sidebar-row" type="button" data-music-view="favorites"><svg class="music-icon" aria-hidden="true"><use href="#music-heart-icon"></use></svg><span data-copy-lang="zh">心水歌曲</span><span data-copy-lang="en">Favourite Songs</span></button>
                        <div class="music-playlist-list" data-music-playlists></div>
                    </section>
                </div>
                <div class="music-account" aria-label="Anson Lo"><img src="assets/music/playlists/profile.png" alt="" width="29" height="29"><strong data-music-profile-name>Anson Lo</strong></div>
            </aside>
            <main class="music-main">
                <header class="music-main-toolbar" data-drag-handle>
                    <h3 data-music-toolbar-title><span data-copy-lang="zh">今個星期</span><span data-copy-lang="en">This Week</span></h3>
                    <div class="music-toolbar-actions">
                        <button class="music-toolbar-circle" type="button" data-music-sidebar-toggle aria-label="隱藏側邊欄" aria-pressed="false"><svg class="music-icon" aria-hidden="true"><use href="#music-sidebar-icon"></use></svg></button>
                        <label class="music-toolbar-search"><svg class="music-icon" aria-hidden="true"><use href="#music-search-icon"></use></svg><input type="search" data-music-search autocomplete="off" spellcheck="false" placeholder="在最近加入中尋找" aria-label="在最近加入中尋找"></label>
                    </div>
                </header>
                <div class="music-recent-scroll" data-music-scroll>
                    <div class="music-recent-sections" data-music-recent-sections></div>
                    <p class="music-empty" data-music-search-empty hidden><span data-copy-lang="zh">找不到相符的專輯。</span><span data-copy-lang="en">No matching albums.</span></p>
                </div>
            </main>
            <aside class="music-lyrics" data-music-lyrics aria-label="歌詞">
                <div class="music-lyrics-scroll">
                    <p class="music-lyric-clipped" aria-hidden="true">and the scars</p>
                    <p class="is-current">I'd wear like<br>tattoos</p>
                    <p>And if it meant<br>dying</p>
                    <p>Then I'd die for<br>you</p>
                    <p>I'd die for you</p>
                    <p>I'd die for you</p>
                    <footer><strong>創作者：</strong>Calum Scott, Corey Sanders, Jon Maguire</footer>
                </div>
            </aside>
            <footer class="music-player" aria-label="Music controls">
                <div class="music-transport">
                    <button class="is-muted" type="button" data-music-control="shuffle" data-music-shuffle aria-label="隨機播放" aria-pressed="false"><svg class="music-icon" aria-hidden="true"><use href="#music-shuffle-icon"></use></svg></button>
                    <button type="button" data-music-control="previous" data-music-previous aria-label="上一首"><svg class="music-icon" aria-hidden="true"><use href="#music-previous-icon"></use></svg></button>
                    <button class="music-play-button" type="button" data-music-control="play" data-music-play aria-label="播放"><svg class="music-icon music-play-icon" aria-hidden="true"><use href="#music-play-icon"></use></svg><svg class="music-icon music-pause-icon" aria-hidden="true"><use href="#music-pause-icon"></use></svg></button>
                    <button type="button" data-music-control="next" data-music-next aria-label="下一首"><svg class="music-icon" aria-hidden="true"><use href="#music-next-icon"></use></svg></button>
                    <button class="is-muted" type="button" data-music-control="repeat" data-music-repeat aria-label="重複播放" aria-pressed="false"><svg class="music-icon" aria-hidden="true"><use href="#music-repeat-icon"></use></svg></button>
                </div>
                <div class="music-now-playing">
                    <span class="music-player-art" data-music-player-art aria-hidden="true"><svg class="music-icon"><use href="#music-note-icon"></use></svg></span>
                    <span class="music-now-playing-copy"><strong data-music-player-title>Die For You</strong><small data-music-player-artist>Calum Scott — Avenoir</small><span class="music-progress" aria-hidden="true"><i data-music-progress></i></span></span>
                </div>
                <div class="music-player-actions">
                    <button class="is-muted" type="button" data-music-control="autoplay" aria-label="自動播放" disabled><svg class="music-icon" aria-hidden="true"><use href="#music-autoplay-icon"></use></svg></button>
                    <button type="button" data-music-control="more" aria-label="更多"><svg class="music-icon" aria-hidden="true"><use href="#music-more-icon"></use></svg></button>
                    <button class="is-active" type="button" data-music-control="lyrics" data-music-lyrics-toggle aria-label="顯示歌詞" aria-pressed="true"><svg class="music-icon" aria-hidden="true"><use href="#music-lyrics-icon"></use></svg></button>
                    <button type="button" data-music-control="queue" aria-label="待播清單"><svg class="music-icon" aria-hidden="true"><use href="#music-queue-icon"></use></svg></button>
                    <button type="button" data-music-control="airplay" aria-label="AirPlay"><svg class="music-icon" aria-hidden="true"><use href="#music-airplay-icon"></use></svg></button>
                    <label class="music-volume-control" data-music-control="volume"><svg class="music-icon" aria-hidden="true"><use href="#music-volume-icon"></use></svg><input type="range" min="0" max="100" value="72" data-music-volume aria-label="音量"></label>
                </div>
            </footer>
        </div>
    </div>
</section>
