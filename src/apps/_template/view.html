<section class="app-window __APP_ID__-window" data-window="__APP_ID__" data-app-label="__APP_LABEL__" aria-labelledby="__APP_ID__-window-title" hidden>
    <div class="window-surface">
        <header class="window-titlebar" data-drag-handle>
            <div class="traffic-lights" role="group" aria-label="Window controls">
                <button class="traffic-close" type="button" data-window-action="close" aria-label="Close window"></button>
                <button class="traffic-minimize" type="button" data-window-action="minimize" aria-label="Minimize window"></button>
                <button class="traffic-maximize" type="button" data-window-action="maximize" aria-label="Maximize window"></button>
            </div>
            <h2 id="__APP_ID__-window-title">__APP_LABEL__</h2>
            <span class="titlebar-spacer" aria-hidden="true"></span>
        </header>
        <main class="__APP_ID__-content">
            <p><span data-copy-lang="zh">這是我的新 App。</span><span data-copy-lang="en">This is my new app.</span></p>
            <button type="button" data-__APP_ID__-action>
                <span data-copy-lang="zh">試一下</span><span data-copy-lang="en">Try it</span>
            </button>
            <p data-__APP_ID__-status role="status" aria-live="polite"></p>
        </main>
    </div>
</section>
