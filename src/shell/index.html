<!doctype html>
<html lang="zh-Hant" data-language="zh">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="anson-ui-contract-version" content="{{BUILD_VERSION}}">
    <meta name="theme-color" content="#234d46">
    <meta name="color-scheme" content="dark">
    <title>Anson Lo | 個人網站</title>
    <meta name="description" content="你好，我是來自澳門的學生開發者 Anson。這裡放我做過的程式、寫作、筆記，以及最近在看的書。">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ansonlotiniat.github.io/">
    <meta property="og:title" content="Anson Lo | 個人網站">
    <meta property="og:description" content="程式、寫作、課堂筆記和最近在看的書，都放在這個像 Mac 桌面的網站裡。">
    <meta property="og:image" content="https://ansonlotiniat.github.io/assets/wallpapers/mit-killian-court.jpg">
    <meta property="og:image:alt" content="Anson Lo 的個人網站桌面">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Anson Lo | Personal Site">
    <meta name="twitter:description" content="Code, writing, class notes, and current reading on a Mac-like desktop.">
    <meta name="twitter:image" content="https://ansonlotiniat.github.io/assets/wallpapers/mit-killian-court.jpg">

    <link rel="canonical" href="https://ansonlotiniat.github.io/">
    <link rel="icon" href="assets/app-icons/apps.png" type="image/png">
    <link rel="preload" href="JetBrainsMono-Variable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/wallpapers/mit-killian-court.jpg" as="image" type="image/jpeg">
    <link rel="preload" href="assets/app-icons/visual-studio-code.png" as="image" type="image/png">
    <link rel="stylesheet" href="style.css?v={{BUILD_VERSION}}">
    <link rel="stylesheet" href="macos.css?v={{BUILD_VERSION}}">
    <link rel="stylesheet" href="dock.css?v={{BUILD_VERSION}}">
    <link rel="stylesheet" href="icons.css?v={{BUILD_VERSION}}">
    <script>
        document.documentElement.classList.add("js");
        {{APP_EARLY_SCRIPTS}}
    </script>
    <script src="vendor/gsap.min.js" defer></script>
    <script src="apps.config.js?v={{BUILD_VERSION}}" defer></script>
    <script src="main.js?v={{BUILD_VERSION}}" defer></script>
</head>
<body>
    <a class="skip-link" href="#desktop">
        <span data-copy-lang="zh">跳到桌面</span>
        <span data-copy-lang="en">Skip to desktop</span>
    </a>

    <div class="os-shell" data-os>
        <div class="wallpaper" aria-hidden="true">
            <div class="wallpaper-shade"></div>
        </div>

        <header class="menu-bar" aria-label="AnsonOS menu bar">
            <div class="menu-left">
                <div class="menu-item">
                    <button class="menu-brand" type="button" data-menu-trigger="apple" aria-expanded="false" aria-controls="apple-menu" aria-label="Apple menu">
                        <span aria-hidden="true"></span>
                    </button>
                    <div class="menu-popover apple-menu" id="apple-menu" data-menu-panel="apple" role="menu" hidden>
                        <button type="button" role="menuitem" data-open-app="about">
                            <span data-copy-lang="zh">關於 AnsonOS</span>
                            <span data-copy-lang="en">About AnsonOS</span>
                        </button>
                        <button type="button" role="menuitem" data-menu-command="show-view-options">
                            <span data-copy-lang="zh">系統設定…</span>
                            <span data-copy-lang="en">System Settings…</span>
                        </button>
                        <span class="menu-separator" aria-hidden="true"></span>
                        <button type="button" role="menuitem" data-menu-command="open-spotlight">
                            <span data-copy-lang="zh">Spotlight…</span>
                            <span data-copy-lang="en">Spotlight…</span>
                            <kbd>⌘Space</kbd>
                        </button>
                        <span class="menu-separator" aria-hidden="true"></span>
                        <a role="menuitem" href="mailto:ansonlotiniat@gmail.com">
                            <span data-copy-lang="zh">聯絡 Anson…</span>
                            <span data-copy-lang="en">Contact Anson…</span>
                        </a>
                    </div>
                </div>
                <strong class="active-app-name" data-active-app>Finder</strong>
                <div class="menu-item">
                    <button class="menu-word" type="button" data-menu-trigger="file" aria-expanded="false" aria-controls="file-menu">
                        <span data-copy-lang="zh">檔案</span>
                        <span data-copy-lang="en">File</span>
                    </button>
                    <div class="menu-popover" id="file-menu" data-menu-panel="file" role="menu" hidden>
                        <button type="button" role="menuitem" data-menu-command="new-finder">
                            <span data-copy-lang="zh">新增 Finder 視窗</span>
                            <span data-copy-lang="en">New Finder Window</span>
                            <kbd>⌘N</kbd>
                        </button>
                        <button type="button" role="menuitem" data-menu-command="open-launchpad">
                            <span data-copy-lang="zh">打開 App…</span>
                            <span data-copy-lang="en">Open App…</span>
                            <kbd>⌘O</kbd>
                        </button>
                        <span class="menu-separator" aria-hidden="true"></span>
                        <button type="button" role="menuitem" data-menu-command="close-active">
                            <span data-copy-lang="zh">關閉視窗</span>
                            <span data-copy-lang="en">Close Window</span>
                            <kbd>⌘W</kbd>
                        </button>
                    </div>
                </div>
                <div class="menu-item menu-item-collapsible">
                    <button class="menu-word" type="button" data-menu-trigger="edit" aria-expanded="false" aria-controls="edit-menu">
                        <span data-copy-lang="zh">編輯</span>
                        <span data-copy-lang="en">Edit</span>
                    </button>
                    <div class="menu-popover" id="edit-menu" data-menu-panel="edit" role="menu" hidden>
                        <button type="button" role="menuitem" data-menu-command="open-spotlight">
                            <span data-copy-lang="zh">搜尋這個網站…</span>
                            <span data-copy-lang="en">Search This Site…</span>
                            <kbd>⌘F</kbd>
                        </button>
                        <button type="button" role="menuitem" data-menu-command="language">
                            <span data-copy-lang="zh">切換至 English</span>
                            <span data-copy-lang="en">Switch to 中文</span>
                        </button>
                    </div>
                </div>
                <div class="menu-item menu-item-collapsible">
                    <button class="menu-word" type="button" data-menu-trigger="view" aria-expanded="false" aria-controls="view-menu">
                        <span data-copy-lang="zh">顯示方式</span>
                        <span data-copy-lang="en">View</span>
                    </button>
                    <div class="menu-popover" id="view-menu" data-menu-panel="view" role="menu" hidden>
                        <button type="button" role="menuitem" data-menu-command="show-view-options">
                            <span data-copy-lang="zh">顯示顯示方式選項</span>
                            <span data-copy-lang="en">Show View Options</span>
                            <kbd>⌘J</kbd>
                        </button>
                        <button type="button" role="menuitem" data-menu-command="clean-up">
                            <span data-copy-lang="zh">整理桌面</span>
                            <span data-copy-lang="en">Clean Up Desktop</span>
                        </button>
                    </div>
                </div>
                <div class="menu-item menu-item-collapsible">
                    <button class="menu-word" type="button" data-menu-trigger="go" aria-expanded="false" aria-controls="go-menu">
                        <span data-copy-lang="zh">前往</span>
                        <span data-copy-lang="en">Go</span>
                    </button>
                    <div class="menu-popover" id="go-menu" data-menu-panel="go" role="menu" hidden>
                        <button type="button" role="menuitem" data-open-app="about">Finder</button>
                        <button type="button" role="menuitem" data-open-app="xcode">Xcode</button>
                        <button type="button" role="menuitem" data-open-app="vscode">Visual Studio Code</button>
                        <button type="button" role="menuitem" data-open-app="overleaf">Overleaf</button>
                        <button type="button" role="menuitem" data-open-app="goodnotes">Goodnotes</button>
                        <button type="button" role="menuitem" data-open-app="books">Books</button>
                        <button type="button" role="menuitem" data-open-app="netflix">Netflix</button>
                        <button type="button" role="menuitem" data-open-app="music">Music</button>
                    </div>
                </div>
                <div class="menu-item menu-item-collapsible">
                    <button class="menu-word" type="button" data-menu-trigger="window" aria-expanded="false" aria-controls="window-menu">
                        <span data-copy-lang="zh">視窗</span>
                        <span data-copy-lang="en">Window</span>
                    </button>
                    <div class="menu-popover" id="window-menu" data-menu-panel="window" role="menu" hidden>
                        <button type="button" role="menuitem" data-menu-command="minimize-active">
                            <span data-copy-lang="zh">縮小</span>
                            <span data-copy-lang="en">Minimize</span>
                            <kbd>⌘M</kbd>
                        </button>
                        <button type="button" role="menuitem" data-menu-command="maximize-active">
                            <span data-copy-lang="zh">縮放</span>
                            <span data-copy-lang="en">Zoom</span>
                        </button>
                        <button type="button" role="menuitem" data-menu-command="bring-all">
                            <span data-copy-lang="zh">將全部移到最前方</span>
                            <span data-copy-lang="en">Bring All to Front</span>
                        </button>
                    </div>
                </div>
                <div class="menu-item menu-item-collapsible menu-item-help">
                    <button class="menu-word" type="button" data-menu-trigger="help" aria-expanded="false" aria-controls="help-menu">
                        <span data-copy-lang="zh">輔助說明</span>
                        <span data-copy-lang="en">Help</span>
                    </button>
                    <div class="menu-popover" id="help-menu" data-menu-panel="help" role="menu" hidden>
                        <button type="button" role="menuitem" data-menu-command="open-spotlight">
                            <span data-copy-lang="zh">搜尋 AnsonOS 輔助說明</span>
                            <span data-copy-lang="en">Search AnsonOS Help</span>
                        </button>
                        <button type="button" role="menuitem" data-open-app="about">
                            <span data-copy-lang="zh">關於 Anson</span>
                            <span data-copy-lang="en">About Anson</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="menu-right">
                <button class="menu-status-button input-source" type="button" data-language-toggle aria-label="Switch language">
                    <span data-copy-lang="zh">中</span>
                    <span data-copy-lang="en">ABC</span>
                </button>
                <button class="menu-status-button menu-explore" type="button" data-open-explore aria-label="Open Explore">
                    <span class="search-glyph" aria-hidden="true"></span>
                </button>
                <span class="menu-status-slot wifi-status" aria-hidden="true">
                    <i class="wifi-icon"></i>
                </span>
                <div class="status-menu control-center-menu">
                    <button class="menu-status-button control-center-button" type="button" data-status-trigger="control-center" aria-expanded="false" aria-controls="control-center-panel" aria-label="Control Center">
                        <span class="control-center-icon" aria-hidden="true"><i></i><i></i></span>
                    </button>
                    <div class="status-panel control-center-panel" id="control-center-panel" data-status-panel="control-center" hidden>
                        <div class="control-grid">
                            <button type="button" class="control-card is-on" data-menu-command="open-spotlight">
                                <b>Wi-Fi</b><span>AnsonOS</span>
                            </button>
                            <button type="button" class="control-card" data-language-toggle>
                                <b data-copy-lang="zh">語言</b><b data-copy-lang="en">Language</b>
                                <span data-copy-lang="zh">中文</span><span data-copy-lang="en">English</span>
                            </button>
                        </div>
                        <label class="control-slider">
                            <span data-copy-lang="zh">顯示器</span><span data-copy-lang="en">Display</span>
                            <input type="range" min="72" max="112" value="100" data-display-brightness>
                        </label>
                    </div>
                </div>
                <div class="status-menu">
                    <button class="battery-status" type="button" data-status-trigger="battery" aria-expanded="false" aria-controls="battery-panel">
                        <b>92%</b><i class="battery-icon" aria-hidden="true"></i>
                    </button>
                    <div class="status-panel battery-panel" id="battery-panel" data-status-panel="battery" hidden>
                        <div class="battery-panel-heading"><b>Battery</b><span>92%</span></div>
                        <p>Power Source: AnsonOS</p>
                        <hr>
                        <button type="button" data-open-app="about">Battery Preferences…</button>
                    </div>
                </div>
                <div class="status-menu">
                    <button class="clock-button" type="button" data-status-trigger="calendar" aria-expanded="false" aria-controls="calendar-panel">
                        <time class="menu-clock" data-clock datetime="2026-07-31T01:00:00+08:00">Fri Jul 31&nbsp;&nbsp;1:00 AM</time>
                    </button>
                    <div class="status-panel calendar-panel" id="calendar-panel" data-status-panel="calendar" hidden>
                        <span data-calendar-weekday>Friday</span>
                        <strong data-calendar-day>31</strong>
                        <p data-calendar-month>July 2026</p>
                    </div>
                </div>
            </div>
        </header>

        <main class="desktop" id="desktop" data-desktop tabindex="-1">
            <h1 id="desktop-title" class="sr-only">Anson Lo 的個人網站</h1>

            <div class="desktop-icons" role="group" aria-label="Desktop shortcuts">
                <button class="desktop-icon" type="button" data-open-app="about">
                    <span class="desktop-icon-art desktop-folder-icon" aria-hidden="true">
                        <img src="assets/app-icons/home-folder.png" alt="" width="64" height="64">
                    </span>
                    <span>
                        <span data-copy-lang="zh">Anson Lo</span>
                        <span data-copy-lang="en">Anson Lo</span>
                    </span>
                </button>
            </div>
        </main>

        <div class="desktop-context-menu" data-context-menu role="menu" hidden>
            <button type="button" role="menuitem" data-context-command="new-finder">
                <span data-copy-lang="zh">新增 Finder 視窗</span>
                <span data-copy-lang="en">New Finder Window</span>
            </button>
            <button type="button" role="menuitem" data-context-command="get-info">
                <span data-copy-lang="zh">取得資訊</span>
                <span data-copy-lang="en">Get Info</span>
            </button>
            <span aria-hidden="true"></span>
            <button type="button" role="menuitem" data-context-command="open-launchpad">
                <span data-copy-lang="zh">探索 App</span>
                <span data-copy-lang="en">Explore Apps</span>
            </button>
            <button type="button" role="menuitem" data-context-command="clean-up">
                <span data-copy-lang="zh">整理</span>
                <span data-copy-lang="en">Clean Up</span>
            </button>
            <button type="button" role="menuitem" data-context-command="show-view-options">
                <span data-copy-lang="zh">顯示顯示方式選項</span>
                <span data-copy-lang="en">Show View Options</span>
            </button>
        </div>

        <section class="desktop-view-options" data-view-options aria-labelledby="view-options-title" hidden>
            <header>
                <h2 id="view-options-title">
                    <span data-copy-lang="zh">桌面顯示方式</span>
                    <span data-copy-lang="en">Desktop View Options</span>
                </h2>
                <button type="button" data-close-view-options aria-label="Close">×</button>
            </header>
            <label>
                <span data-copy-lang="zh">圖示大小</span><span data-copy-lang="en">Icon size</span>
                <input type="range" min="52" max="84" value="64" data-desktop-icon-size>
            </label>
            <label>
                <span data-copy-lang="zh">格線間距</span><span data-copy-lang="en">Grid spacing</span>
                <input type="range" min="8" max="32" value="14" data-desktop-grid-spacing>
            </label>
        </section>

        <div class="window-layer" data-window-layer aria-live="off">
            {{APP_WINDOWS}}
        </div>

        <section class="launchpad" id="launchpad" data-launchpad role="dialog" aria-labelledby="launchpad-title" hidden>
            <h2 class="sr-only" id="launchpad-title">Apps</h2>
            <label class="launchpad-search">
                <span class="search-glyph" aria-hidden="true"></span>
                <input type="search" data-launchpad-input autocomplete="off" spellcheck="false" placeholder="搜尋" aria-label="Search Apps">
            </label>
            <div class="launchpad-grid" data-launchpad-results></div>
            <p class="launchpad-empty" data-launchpad-empty hidden>
                <span data-copy-lang="zh">沒有符合的 App</span>
                <span data-copy-lang="en">No matching Apps</span>
            </p>
        </section>

        <div class="explore-backdrop" data-explore-backdrop hidden></div>
        <section class="explore-panel" id="explore" data-explore role="dialog" aria-modal="true" aria-labelledby="explore-title" hidden>
            <h2 id="explore-title" class="sr-only">搜尋 AnsonOS</h2>
            <div class="explore-search">
                <span class="search-glyph" aria-hidden="true"></span>
                <input type="search" data-explore-input autocomplete="off" spellcheck="false" aria-controls="explore-results" placeholder="搜尋 App 或內容" aria-label="搜尋這個網站">
                <span class="explore-run-hint" aria-hidden="true">
                    <span data-copy-lang="zh">打開</span>
                    <span data-copy-lang="en">Open</span>
                    <kbd>↵</kbd>
                </span>
            </div>
            <div class="explore-modes" role="group" aria-label="Explore filters">
                <button class="is-active" type="button" data-explore-filter="" aria-pressed="true">
                    <span data-copy-lang="zh">所有 App</span>
                    <span data-copy-lang="en">All Apps</span>
                </button>
                <button type="button" data-explore-filter="engineering" aria-pressed="false">
                    <span data-copy-lang="zh">程式</span>
                    <span data-copy-lang="en">Code</span>
                </button>
                <button type="button" data-explore-filter="iGEM" aria-pressed="false">
                    <span>iGEM</span>
                </button>
                <button type="button" data-explore-filter="writing" aria-pressed="false">
                    <span data-copy-lang="zh">寫作</span>
                    <span data-copy-lang="en">Writing</span>
                </button>
                <button type="button" data-explore-filter="notes" aria-pressed="false">
                    <span data-copy-lang="zh">學科筆記</span>
                    <span data-copy-lang="en">Study Notes</span>
                </button>
                <button type="button" data-explore-filter="media" aria-pressed="false">
                    <span data-copy-lang="zh">影音</span>
                    <span data-copy-lang="en">Media</span>
                </button>
            </div>
            <div class="explore-body">
                <p class="explore-category">
                    <span data-copy-lang="zh">應用與工作區</span>
                    <span data-copy-lang="en">APPS &amp; WORKSPACES</span>
                </p>
                <div class="explore-results" id="explore-results" role="listbox" data-explore-results></div>
                <p class="explore-empty" data-explore-empty hidden>
                    <span data-copy-lang="zh">找不到相符的 App</span>
                    <span data-copy-lang="en">No matching apps</span>
                </p>
            </div>
        </section>

        <nav class="dock" data-dock aria-label="Applications">
            <span class="dock-glass" aria-hidden="true"></span>
            <span class="dock-hover-label" data-dock-hover-label aria-hidden="true"></span>
        </nav>

        <div class="pixel-cursor" data-pixel-cursor aria-hidden="true">
            <img src="assets/pixel-cursor.svg" alt="">
        </div>

        <div class="os-announcer sr-only" aria-live="polite" data-announcer></div>

        <noscript>
            <div class="noscript-card">
                <h2>Anson Lo</h2>
                <p>這個網站需要 JavaScript 才能打開桌面上的 App。你仍然可以用下面的連結聯絡我。</p>
                <a href="mailto:ansonlotiniat@gmail.com">Email</a>
                <a href="https://github.com/ansonlotiniat">GitHub</a>
            </div>
        </noscript>
    </div>
</body>
</html>
